version: '3.8'

services:
  # 🧠 TruthGuard Agentic Backend
  truthguard-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthguard_api
    ports:
      - "8000:8000"
    volumes:
      # 💾 Neural Experience Persistence (Human corrections saved here)
      - ./backend/feedback_db.json:/app/feedback_db.json
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
    restart: always

  # 📑 TruthGuard Forensic Lab Frontend
  truthguard-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthguard_webapp
    ports:
      - "80:80"
    depends_on:
      - truthguard-backend
    restart: always

volumes:
  # Named volumes for caching transformer weights
  bert_models:
  nltk_data:
