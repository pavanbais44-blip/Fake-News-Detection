version: '3.8'

services:
  # 🧠 TruthGuard Agentic Backend
  truthguard-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthguard_api
    ports:
      - "8000:8000"
    volumes:
      # 💾 Neural Experience Persistence (Human corrections saved here)
      - ./backend/feedback_db.json:/app/feedback_db.json
      # 🧠 Cache Transformers and NLTK to prevent re-downloads
      - bert_models:/home/tguser/.cache/huggingface
      - nltk_data:/home/tguser/nltk_data
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - API_URL=http://localhost:8000
    restart: always

  # 📑 TruthGuard Forensic Lab Frontend
  truthguard-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthguard_webapp
    ports:
      - "80:80"
    depends_on:
      - truthguard-backend
    restart: always

volumes:
  # Named volumes for caching transformer weights across restarts
  bert_models:
  nltk_data:
